
  <style>
    * {
      font-family: 'Courier New', Courier, monospace;
    }

    body,
    html {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    #center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      border-radius: 50%;
      background: white;
      pointer-events: none;
    }

    #result {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -52px);
      color: white;
      font: 24px sans-serif;
      white-space: nowrap;
      pointer-events: none;
    }

    #retry {
      position: absolute;
      top: 50%;
      left: 50%;
      padding: 0.5em 1em;
      border-radius: 5px;
      background: linen;
      transform: translate(-50%, 18px);
      cursor: pointer;
      display: none;  
    }
  </style>

<body>
  <canvas id="game"></canvas>
  <div id="center"></div>
  <div id="result"></div>
  <button id="retry">Try Again</button>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const result = document.getElementById('result');
    const newTryButton = document.getElementById('retry');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    let isDrawing = false;
    let points = [];
    let audioCtx = null;
    let lastSoundTime = 0;

    function playSound(freq, duration, type = 'sine', vol = 0.05) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const now = audioCtx.currentTime;

      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      
      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + duration);
    }

    ctx.strokeStyle = '#40ff00';
    ctx.lineWidth = 4;
    ctx.lineCap = ctx.lineJoin = 'round';

    canvas.addEventListener('pointerdown', e => {
      isDrawing = true;
      points = [];
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      result.textContent = '';
      newTryButton.style.display = 'none';
      ctx.beginPath();
      ctx.moveTo(e.clientX, e.clientY);
      
      playSound(300, 0.08, 'triangle', 0.06);
    });

    canvas.addEventListener('pointermove', e => {
      if (!isDrawing) return;
      points.push({ x: e.clientX - cx, y: cy - e.clientY });
      ctx.lineTo(e.clientX, e.clientY);
      ctx.stroke();

      const now = performance.now();
      if (now - lastSoundTime > 50) {
        lastSoundTime = now;
        playSound(200 + (points.length % 6) * 20, 0.03, 'sine', 0.02);
      }
    });

    canvas.addEventListener('pointerup', () => {
      if (!isDrawing) return;
      isDrawing = false;

      if (points.length < 15) {
        result.textContent = 'Accuracy: 0%';
        newTryButton.style.display = 'block';
        playSound(150, 0.2, 'sawtooth', 0.08);
        return;
      }

      const polar = points.map(p => ({
        r: Math.hypot(p.x, p.y),
        theta: Math.atan2(p.y, p.x)
      }));

      const radii = polar.map(p => p.r);
      const avgRadius = radii.reduce((a, b) => a + b, 0) / radii.length;

      if (avgRadius < 15) {
        result.textContent = 'Accuracy: 0%';
        newTryButton.style.display = 'block';
        return;
      }

      const variance = radii.reduce((sum, r) => sum + Math.pow(r - avgRadius, 2), 0) / radii.length;
      const rmsError = Math.sqrt(variance);
      const radiusScore = Math.max(0, 1 - (rmsError / avgRadius) * 2);

      const numBins = 16;
      const bins = new Array(numBins).fill(false);
      polar.forEach(p => {
        let t = p.theta;
        if (t < 0) t += 2 * Math.PI;
        const binIdx = Math.floor((t / (2 * Math.PI)) * numBins) % numBins;
        bins[binIdx] = true;
      });
      const binsHit = bins.filter(Boolean).length;
      const coverageScore = binsHit / numBins;

      const start = points[0];
      const end = points[points.length - 1];
      const closureDist = Math.hypot(end.x - start.x, end.y - start.y);
      const closureScore = Math.max(0, 1 - (closureDist / avgRadius));

      const finalScore = Math.max(0, Math.round(
        (radiusScore * 0.4 + coverageScore * 0.4 + closureScore * 0.2) * 100
      ));

      result.textContent = `Accuracy: ${finalScore}%`;
      newTryButton.style.display = 'block';

      if (finalScore >= 80) {
        playSound(523.25, 0.15, 'sine', 0.08);
        setTimeout(() => playSound(659.25, 0.2, 'sine', 0.08), 100);
      } else {
        playSound(180, 0.2, 'sawtooth', 0.06);
      }
    });

    newTryButton.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      result.textContent = '';
      newTryButton.style.display = 'none';
      playSound(400, 0.05, 'triangle', 0.05);
    });
  </script>
</body>
